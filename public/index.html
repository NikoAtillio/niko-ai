<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Niko.ai Chart Analysis</title>
    <style>
        body { max-width: 800px; margin: 0 auto; padding: 20px; }
        .result { margin-top: 20px; white-space: pre-wrap; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Upload Trading Chart</h1>
    <form id="uploadForm">
        <input type="file" id="chartImage" name="chart" accept="image/*" required>
        <button type="submit">Analyze Chart</button>
    </form>
    <div id="result" class="result"></div>

    <script>
        const form = document.getElementById('uploadForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.innerHTML = 'Analyzing chart...';

            const formData = new FormData();
            const fileInput = document.getElementById('chartImage');

            if (!fileInput.files[0]) {
                result.innerHTML = '<div class="error">Please select a file</div>';
                return;
            }

            formData.append('chart', fileInput.files[0]);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Analysis failed');

                result.innerHTML = `
                    <div class="success">Analysis Complete!</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
