<!DOCTYPE html>
<html>
<head>
    <title>Niko.ai Chart Analysis</title>
    <style>
        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .result {
            margin-top: 20px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .success {
            color: #28a745;
            font-weight: bold;
        }
        .analysis-section {
            margin: 15px 0;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .analysis-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .insights-list {
            list-style-type: none;
            padding-left: 0;
        }
        .insights-list li {
            margin: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        .insights-list li:before {
            content: "→";
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <h1>Upload Trading Chart</h1>
    <form id="uploadForm">
        <input type="file" id="chartImage" name="chart" accept="image/*" required>
        <button type="submit">Analyze Chart</button>
    </form>
    <div id="result" class="result"></div>

    <script>
        const form = document.getElementById('uploadForm');
        const result = document.getElementById('result');

        function formatAnalysis(data) {
            if (!data.success) {
                return `<div class="error">Error: ${data.error || 'Analysis failed'}</div>`;
            }

            const analysis = data.analysis;
            return `
                <div class="success">Analysis Complete!</div>

                <div class="analysis-section">
                    <div class="analysis-title">Overall Trend</div>
                    <div>${analysis.overallTrend}</div>
                </div>

                <div class="analysis-section">
                    <div class="analysis-title">Key Insights</div>
                    <ul class="insights-list">
                        ${analysis.insights.map(insight => `<li>${insight}</li>`).join('')}
                    </ul>
                </div>

                <div class="analysis-section">
                    <div class="analysis-title">Market Structure</div>
                    <div>Trend Direction: ${analysis.marketStructure.trend.direction}</div>
                    <div>Trend Strength: ${analysis.marketStructure.trend.strength}</div>
                    <div>Support Levels: ${analysis.marketStructure.keyLevels.support.join(', ')}</div>
                    <div>Resistance Levels: ${analysis.marketStructure.keyLevels.resistance.join(', ')}</div>
                </div>

                <div class="analysis-section">
                    <div class="analysis-title">Trade Setup</div>
                    <div>Type: ${analysis.tradeSetup.type}</div>
                    <div>Entry: ${analysis.tradeSetup.entry}</div>
                    <div>Stop Loss: ${analysis.tradeSetup.stopLoss}</div>
                    <div>Targets: ${analysis.tradeSetup.targets.join(', ')}</div>
                    <div>Timeframe: ${analysis.tradeSetup.timeframe}</div>
                    <div>Confidence: ${analysis.tradeSetup.confidence}</div>
                    <div>Setup: ${analysis.tradeSetup.setup}</div>
                </div>
            `;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.innerHTML = 'Analyzing chart...';

            const formData = new FormData();
            const fileInput = document.getElementById('chartImage');

            if (!fileInput.files[0]) {
                result.innerHTML = '<div class="error">Please select a file</div>';
                return;
            }

            formData.append('chart', fileInput.files[0]);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) throw new Error(data.error || 'Analysis failed');

                result.innerHTML = formatAnalysis(data);
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
